<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Screener Dashboard</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
       background:#0f1117;color:#e0e0e0;padding:32px}
  h1{font-size:1.6rem;margin-bottom:4px;color:#fff}
  .subtitle{color:#666;font-size:.9rem;margin-bottom:28px}
  .stats{display:flex;gap:16px;margin-bottom:28px;flex-wrap:wrap}
  .stat{background:#1a1d27;border:1px solid #2a2d3a;border-radius:10px;padding:16px 24px;min-width:140px}
  .stat .label{font-size:.75rem;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
  .stat .value{font-size:1.8rem;font-weight:700;color:#fff}
  .tabs{display:flex;gap:0;margin-bottom:0;border-bottom:2px solid #2a2d3a}
  .tab{text-decoration:none;padding:10px 24px;font-size:.9rem;color:#888;
       border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;background:none;border-top:none;border-left:none;border-right:none}
  .tab:hover{color:#ccc}
  .tab.active{color:#fff;border-bottom:2px solid #2563eb;font-weight:600}
  .tab-count{font-size:.75rem;opacity:.6;margin-left:5px}
  .filters{margin:16px 0;display:flex;gap:10px;flex-wrap:wrap}
  .filter-btn{text-decoration:none;padding:5px 14px;border-radius:20px;font-size:.82rem;
              border:1px solid #2a2d3a;color:#aaa;cursor:pointer;background:none}
  .filter-btn.active{color:#fff;border-color:#2563eb;background:#2563eb}
  .filter-btn:hover:not(.active){color:#ccc;border-color:#444}
  .count{font-size:.72rem;opacity:.7;margin-left:3px}
  table{width:100%;border-collapse:collapse}
  thead th{background:#1a1d27;padding:10px 16px;text-align:left;font-size:.75rem;
           text-transform:uppercase;letter-spacing:.06em;color:#666;border-bottom:1px solid #2a2d3a}
  tbody tr{border-bottom:1px solid #1a1d27}
  tbody tr:hover{background:#1a1d27}
  td{padding:12px 16px;font-size:.9rem}
  .ticker{font-weight:700;color:#60a5fa;font-size:1rem}
  .company-name{font-size:.72rem;color:#555;margin-top:2px}
  .badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:.78rem;font-weight:600}
  .b30{background:#1c3a1c;color:#4ade80}
  .b50{background:#1c2e4a;color:#60a5fa}
  .b100{background:#3a1c2e;color:#f472b6}
  .bd10{background:#2a1f1f;color:#fca5a5}
  .bd20{background:#3a1c1c;color:#f87171}
  .bd40{background:#4a1010;color:#ef4444}
  .gain{font-weight:600}
  .gain-high{color:#4ade80}.gain-mid{color:#60a5fa}.gain-low{color:#facc15}
  .loss-low{color:#fca5a5}.loss-mid{color:#f87171}.loss-high{color:#ef4444}
  .empty{text-align:center;padding:60px;color:#444}
  .table-wrap{background:#13151f;border:1px solid #2a2d3a;border-radius:0 0 10px 10px;overflow:hidden}
  .income-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;padding:20px}
  .income-card{background:#1a1d27;border:1px solid #2a2d3a;border-radius:10px;overflow:hidden}
  .income-card-header{display:flex;align-items:center;justify-content:space-between;
                      padding:12px 16px;border-bottom:1px solid #2a2d3a}
  .income-card-ticker{font-weight:700;color:#60a5fa;font-size:1rem}
  .income-card-name{font-size:.75rem;color:#555;margin-top:2px}
  .income-table{width:100%;border-collapse:collapse;font-size:.85rem}
  .income-table th{padding:7px 14px;text-align:left;font-size:.72rem;text-transform:uppercase;
                   letter-spacing:.05em;color:#555;border-bottom:1px solid #2a2d3a}
  .income-table td{padding:7px 14px;border-bottom:1px solid #13151f}
  .income-table tr:last-child td{border-bottom:none}
  .pos{color:#4ade80;font-weight:600}.neg{color:#f87171;font-weight:600}
  .income-empty{padding:48px;text-align:center;color:#444}
  .income-note{font-size:.78rem;color:#444;padding:0 20px 16px}
  .panel{display:none}.panel.active{display:block}
  .updated{font-size:.75rem;color:#444;margin-top:24px;text-align:right}
</style>
</head>

function fmtVal(v) {
  if (v === null || v === undefined) return '—';
  if (v < 0) return '<span style="color:#f87171">neg.</span>';
  const color = v <= 20 ? '#4ade80' : v <= 40 ? '#fbbf24' : '#a78bfa';
  return `<span style="color:${color}">${v.toFixed(1)}x</span>`;
}

function fmtGain(g) {
  const cls = g >= 100 ? 'gain-high' : g >= 50 ? 'gain-mid' : g >= 0 ? 'gain-low'
            : g >= -20 ? 'loss-low' : g >= -40 ? 'loss-mid' : 'loss-high';
  return `<span class="gain ${cls}">${g.toFixed(1)}%</span>`;
}

function fmtBadge(t) {
  if (t > 0) return `<span class="badge b${t}">≥ ${t}%</span>`;
  return `<span class="badge bd${Math.abs(t)}">≤ -${Math.abs(t)}%</span>`;
}

function fmtPct(p) {
  if (p === null || p === undefined) return '—';
  const cls = p >= 0 ? 'pos' : 'neg';
  return `<span class="${cls}">${p >= 0 ? '+' : ''}${p.toFixed(1)}%</span>`;
}

function fmtIncome(v) {
  if (v === null || v === undefined) return '—';
  const cls = v >= 0 ? 'pos' : 'neg';
  let s;
  if (Math.abs(v) >= 1e9) s = (v/1e9).toFixed(2) + ' B';
  else if (Math.abs(v) >= 1e6) s = (v/1e6).toFixed(1) + ' M';
  else s = v.toLocaleString();
  return `<span class="${cls}">${s}</span>`;
}

// ---- Stats bar ----
(function() {
  const el = document.getElementById('stats-bar');
  el.innerHTML = [
    ['Total Alerts', D.total_gainers + D.total_decliners],
    ['Unique Gainers', D.unique_gainers],
    ['Unique Decliners', D.unique_decliners],
    ['Last Run', `<span style="font-size:1rem;padding-top:4px">${D.last_run}</span>`],
  ].map(([l, v]) =>
    `<div class="stat"><div class="label">${l}</div><div class="value">${v}</div></div>`
  ).join('');
  document.getElementById('updated-label').textContent =
    `Generated ${D.generated}`;
})();

// ---- Tab / filter state ----
let currentTab = 'gainers';
let currentFilter = null;

const TABS = [
  {id:'gainers',   label:'Gainers',    count:() => D.total_gainers},
  {id:'decliners', label:'Decliners',  count:() => D.total_decliners},
  {id:'history',   label:'History',    count:() => D.total_history},
  {id:'income',    label:'Qtr Income', count:() => D.income.length},
  {id:'annual',    label:'Ann Income', count:() => D.annual.length},
];

const GAINER_FILTERS  = [null, 30, 50, 100];
const DECLINER_FILTERS = [null, 10, 20, 40];

function renderTabs() {
  document.getElementById('tab-bar').innerHTML = TABS.map(t =>
    `<button class="tab${t.id===currentTab?' active':''}" onclick="switchTab('${t.id}')">
      ${t.label} <span class="tab-count">(${t.count()})</span>
    </button>`
  ).join('');
}

function switchTab(id) {
  currentTab = id;
  currentFilter = null;
  renderTabs();
  renderPanels();
}

function switchFilter(f) {
  currentFilter = f;
  renderPanels();
}

function countByThreshold(rows, t) {
  return rows.filter(r => r.threshold === t).length;
}

function filterRows(rows) {
  if (currentFilter === null) return rows;
  const sign = currentTab === 'gainers' ? 1 : -1;
  return rows.filter(r => r.threshold === sign * currentFilter);
}

function alertTable(rows, showRemoved) {
  if (!rows.length) return '<div class="empty">No alerts yet.</div>';
  const remCol = showRemoved ? '<th>Removed</th>' : '';
  const body = rows.map(r => {
    const remCell = showRemoved ? `<td style="color:#666">${r.removed || '—'}</td>` : '';
    return `<tr>
      <td><span class="ticker">${r.ticker}</span>
        ${r.name ? `<div class="company-name">${r.name}</div>` : ''}
      </td>
      <td>${fmtBadge(r.threshold)}</td>
      <td>${fmtGain(r.gain)}</td>
      <td>${fmtVal(r.valuation)}</td>
      <td>${r.date}</td>
      ${remCell}
    </tr>`;
  }).join('');
  return `<table>
    <thead><tr>
      <th>Ticker</th><th>Threshold</th><th>Gain at Alert</th>
      <th title="Market cap ÷ trailing 12-month net income">P/E (TTM)</th>
      <th>Alert Date</th>${remCol}
    </tr></thead>
    <tbody>${body}</tbody>
  </table>`;
}

function filterBar(filters, activeFilter, isDecliners) {
  const allCount = isDecliners ? D.total_decliners : D.total_gainers;
  const tab = isDecliners ? 'decliners' : 'gainers';
  const rows = isDecliners ? D.decliners : D.gainers;
  return '<div class="filters">' + filters.map(f => {
    const active = f === activeFilter;
    const label = f === null
      ? `All <span class="count">(${allCount})</span>`
      : isDecliners
        ? `≤ -${f}% <span class="count">(${countByThreshold(rows, -f)})</span>`
        : `≥ ${f}% <span class="count">(${countByThreshold(rows, f)})</span>`;
    return `<button class="filter-btn${active?' active':''}" onclick="switchFilter(${f === null ? 'null' : f})">${label}</button>`;
  }).join('') + '</div>';
}

function incomeCards(entries, isAnnual) {
  if (!entries.length)
    return '<div class="income-empty">No companies added yet.</div>';
  return '<div class="income-grid">' + entries.map(e => {
    const rows = isAnnual
      ? (e.years || []).slice().reverse().map(y =>
          `<tr>
            <td>${y.year}</td>
            <td>${fmtIncome(y.net_income)}</td>
            <td>${fmtPct(y.yoy)}</td>
          </tr>`).join('')
      : (e.quarters || []).slice().reverse().map(q =>
          `<tr>
            <td>${q.period}</td>
            <td>${fmtIncome(q.net_income)}</td>
            <td>${fmtPct(q.qoq)}</td>
            <td>${fmtPct(q.yoy)}</td>
          </tr>`).join('');
    const cols = isAnnual
      ? '<th>Year</th><th>Net Income</th><th>YoY</th>'
      : '<th>Quarter</th><th>Net Income</th><th>QoQ</th><th>YoY</th>';
    const data = isAnnual ? e.years : e.quarters;
    const inner = data && data.length
      ? `<table class="income-table"><thead><tr>${cols}</tr></thead><tbody>${rows}</tbody></table>`
      : '<div style="padding:20px;color:#444;font-size:.85rem">No EDGAR data found.</div>';
    return `<div class="income-card">
      <div class="income-card-header">
        <div>
          <div class="income-card-ticker">${e.ticker}</div>
          ${e.name ? `<div class="income-card-name">${e.name}</div>` : ''}
        </div>
      </div>
      ${inner}
    </div>`;
  }).join('') + '</div>';
}

function renderPanels() {
  let html = '';
  if (currentTab === 'gainers') {
    const rows = filterRows(D.gainers);
    html = filterBar(GAINER_FILTERS, currentFilter, false)
         + '<div class="table-wrap">' + alertTable(rows, false) + '</div>';
  } else if (currentTab === 'decliners') {
    const rows = filterRows(D.decliners);
    html = filterBar(DECLINER_FILTERS, currentFilter, true)
         + '<div class="table-wrap">' + alertTable(rows, false) + '</div>';
  } else if (currentTab === 'history') {
    html = '<div class="table-wrap">' + alertTable(D.history, true) + '</div>';
  } else if (currentTab === 'income') {
    const note = '<p class="income-note">Last 10 quarters of net income from SEC EDGAR.</p>';
    html = '<div class="table-wrap" style="border-radius:0 10px 10px 10px">'
         + note + incomeCards(D.income, false) + '</div>';
  } else if (currentTab === 'annual') {
    const note = '<p class="income-note">Last 7 fiscal years of net income from SEC EDGAR.</p>';
    html = '<div class="table-wrap" style="border-radius:0 10px 10px 10px">'
         + note + incomeCards(D.annual, true) + '</div>';
  }
  document.getElementById('panels').innerHTML = html;
  // sync tab bar in case counts changed
  renderTabs();
}

// restore tab from URL hash
const hash = location.hash.replace('#', '');
if (TABS.find(t => t.id === hash)) currentTab = hash;

// update hash on tab switch
const _origSwitch = switchTab;
window.switchTab = function(id) {
  _origSwitch(id);
  history.replaceState(null, '', '#' + id);
};

renderTabs();
renderPanels();
</script>
